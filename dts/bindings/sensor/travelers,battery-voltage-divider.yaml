# SPDX-License-Identifier: MIT

description: |
  Battery sensor for a switched voltage divider. Unlike ZMK v0.3's built-in
  driver, the settling delay is configured by settle-delay-ms.

compatible: "travelers,battery-voltage-divider"

include: voltage-divider.yaml

properties:
  power-gpios:
    type: phandle-array
    required: true
    description: GPIO that enables the divider before sampling.
  settle-delay-ms:
    type: int
    required: true
    description: Time to wait after enabling the divider before sampling.
  empty-millivolts:
    type: int
    required: true
    description: Voltage reported as 0 percent.
  full-millivolts:
    type: int
    required: true
    description: Voltage reported as 100 percent.
